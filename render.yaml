services:
  - type: web
    name: sprouty-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DEVICE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REQUIRE_AUTH
        value: "false"
